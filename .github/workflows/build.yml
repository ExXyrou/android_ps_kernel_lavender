name: 🛠️ BUILD KERNEL 4.4 PREDATOR STORMBREAKER

on:
  workflow_dispatch:
    inputs:
      TELEGRAM_GROUP_ID:
        description: '💬 Telegram Group Id'
        required: true
        type: string
      LOCALVERSION:
        description: '🏷️ Custom Kernel Name (e.g., MyKernel-v1.0)'
        required: false
        type: string
      LOCALVERSION_AUTO:
        description: '🔧 Enable Localversion Auto'
        required: true
        default: false
        type: boolean
      DEFAULT_HOSTNAME:
        description: '💻 Kernel Hostname (e.g., xiaomi@redmi)'
        required: true
        default: xiaomi@redmi
        type: string
      BUILD_USER:
        description: '👤 Build Username (e.g., xiaomi)'
        required: true
        default: xiaomi
        type: string
      BUILD_HOST:
        description: '🖥️ Build Hostname (e.g., redmi)'
        required: true
        default: redmi
        type: string
      QTI_HAPTICS:
        description: '📳 Include QTI Haptics Support'
        required: true
        default: false
        type: boolean
      BUILD_NEWCAM:
        description: '📷 Use Newcam Build'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Inject KernelSU'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - kowsu
          - xxksu

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/android_ps_kernel_lavender.git
  KERNEL_BRANCH: oldcam
  DEFCONFIG: lavender-perf_defconfig
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  BOT_API: 8938357014:AAEV77hiQxIYxXJQLWijjzGuqsUQN1Hsu14

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository & Start Timer
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize Build Environment
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Clone Kernel Source
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: Configure Kernel Version & Strings
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CLEAN_INPUT=$(echo "${{ inputs.LOCALVERSION }}" | sed 's/^-//')
          BASE_NAME="${CLEAN_INPUT:-}"
          
          if [ -n "$BASE_NAME" ]; then
            FINAL_LOCAL="-${BASE_NAME}"
          else
            FINAL_LOCAL=""
          fi
          
          echo "KERNEL_NAME_STRING=$FINAL_LOCAL" >> $GITHUB_ENV
          echo "Kernel string configured: $FINAL_LOCAL"

          KVER_MAJOR=$(grep -m1 '^VERSION =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_PATCH=$(grep -m1 '^PATCHLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_SUB=$(grep -m1 '^SUBLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          FULL_KVER="${KVER_MAJOR}.${KVER_PATCH}.${KVER_SUB}"
          echo "KERNEL_VERSION=$FULL_KVER" >> $GITHUB_ENV
          echo "Detected version: $FULL_KVER"

      - name: Install Build Dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
          for i in 1 2 3; do sudo apt-get update -yq && break; sleep 10; done
          sudo apt-get install -yq --no-install-recommends \
            -o Acquire::Retries=3 \
            bc bison libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hmp-${{ env.DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-hmp-${{ env.DEFCONFIG }}-

      - name: Setup KernelSU
        if: ${{ inputs.INJECT_KSU != 'none' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ inputs.INJECT_KSU }}" == "kowsu" ]; then
            export KSU_EXPECTED_SIZE="0x375"
            export KSU_EXPECTED_HASH="484fcba6e6c43b1fb09700633bf2fb4758f13cb0b2f4457b80d075084b26c588"
            export KSU_MANAGER_PACKAGE="com.kowx712.supermanager"
          fi
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          
          KSU_TAG=$(curl -s https://api.github.com/repos/backslashxx/KernelSU/releases/latest | grep -o '"tag_name": *"[^"]*"' | head -n 1 | cut -d'"' -f4)
          KSU_URL="${KSU_TAG:+https://github.com/backslashxx/KernelSU/releases/tag/$KSU_TAG}"
          echo "KSU_LINK=${KSU_URL:-https://github.com/backslashxx/KernelSU/releases}" >> $GITHUB_ENV

      - name: Setup Clang Toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-aosp-${{ hashFiles('.github/workflows/*.yml') }}

      - name: Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz" -o aosp_clang.archive
          tar -xf aosp_clang.archive || unzip aosp_clang.archive && rm -f aosp_clang.archive

      - name: Fix Resource Errors & Prepare Configs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          [ -f scripts/dtc/dtc-parser.tab.c ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-parser.tab.c
          [ -f scripts/dtc/dtc-lexer.lex.c_shipped ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped

          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.DEFCONFIG }}

          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }
          set_str() { ./scripts/config --file "$OUT_DIR/.config" --set-str "$1" "$2"; }

          set_str CONFIG_DEFAULT_HOSTNAME "${{ inputs.DEFAULT_HOSTNAME }}"
          set_str CONFIG_LOCALVERSION "${{ env.KERNEL_NAME_STRING }}"

          if [ "${{ inputs.LOCALVERSION_AUTO }}" == "true" ]; then
            enable_config CONFIG_LOCALVERSION_AUTO
            [ -d ".git" ] && git config --global --add safe.directory "$PWD" && git update-index --assume-unchanged $(git ls-files) || true
          else
            disable_config CONFIG_LOCALVERSION_AUTO
          fi

          [ "${{ inputs.QTI_HAPTICS }}" == "true" ] && enable_config CONFIG_INPUT_QTI_HAPTICS
          [ "${{ inputs.BUILD_NEWCAM }}" == "true" ] && enable_config CONFIG_XIAOMI_NEW_CAMERA_BLOBS

          if [ "${{ inputs.INJECT_KSU }}" != "none" ]; then
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang olddefconfig

      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"
          
          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-address -Wno-implicit-function-declaration" Image.gz-dtb 2>&1 | tee build.log

          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Error: Kernel file (Image.gz-dtb) not found!"
            exit 1
          fi

      - name: Package Kernel Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.gz-dtb" 2>/dev/null | head -n1)
          
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 -b original https://github.com/ExXyrou/AnyKernel3 AnyKernel3
          cp "$IMAGE" AnyKernel3/
          
          FINAL_LOCALVER=$(echo "${{ env.KERNEL_NAME_STRING }}" | sed 's/^-//')
          sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' AnyKernel3/anykernel.sh
          
          TIMESTAMP=$(date +'%Y%m%d')
          if [ -n "$FINAL_LOCALVER" ]; then
            ZIP_NAME="lavender-${{ env.KERNEL_VERSION }}${{ env.KERNEL_NAME_STRING }}-${TIMESTAMP}.zip"
          else
            ZIP_NAME="lavender-${{ env.KERNEL_VERSION }}-${TIMESTAMP}.zip"
          fi
          
          cd AnyKernel3 && zip -r9 "$ZIP_NAME" * -x ".git/*"
          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Send Telegram Notification (Success)
        if: success()
        run: |
          DURATION=$(( $(date +%s) - ${{ env.BUILD_START_TIME }} ))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"
          CAM_TYPE=$([ "${{ inputs.BUILD_NEWCAM }}" == "true" ] && echo "newcam" || echo "oldcam")

          if [ "${{ inputs.INJECT_KSU }}" == "kowsu" ]; then
            KSU_TEXT='<a href="https://t.me/kowsu_build">kowsu</a>'
          elif [ "${{ inputs.INJECT_KSU }}" == "xxksu" ]; then
            KSU_TEXT='<a href="${{ env.KSU_LINK }}">xxksu</a>'
          else
            KSU_TEXT='<code>none</code>'
          fi

          MESSAGE=$(printf '✅ <b>BUILD SUCCESS</b>\n\n📱 <b>Device:</b> <code>Lavender</code>\n🏷️ <b>Kernel Name:</b> <code>%s%s</code>\n📷 <b>Build Type:</b> <code>%s</code>\n📳 <b>QTI Haptics:</b> <code>%s</code>\n🦊 <b>KSU:</b> %s\n🛠️ <b>Clang:</b> <code>AOSP r383902</code>\n⏱️ <b>Time:</b> <code>%s</code>' "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "$CAM_TYPE" "${{ inputs.QTI_HAPTICS }}" "$KSU_TEXT" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
            -F chat_id="${{ inputs.TELEGRAM_GROUP_ID }}" \
            -F document="@${{ steps.img.outputs.zip_path }}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"

      - name: Send Telegram Notification (Failure)
        if: failure()
        run: |
          DURATION=$(( $(date +%s) - ${{ env.BUILD_START_TIME }} ))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"
          CAM_TYPE=$([ "${{ inputs.BUILD_NEWCAM }}" == "true" ] && echo "newcam" || echo "oldcam")

          if [ "${{ inputs.INJECT_KSU }}" == "kowsu" ]; then
            KSU_TEXT='<a href="https://t.me/kowsu_build">kowsu</a>'
          elif [ "${{ inputs.INJECT_KSU }}" == "xxksu" ]; then
            KSU_TEXT='<a href="${{ env.KSU_LINK }}">xxksu</a>'
          else
            KSU_TEXT='<code>none</code>'
          fi

          MESSAGE=$(printf '❌ <b>BUILD FAILED</b>\n\n📱 <b>Device:</b> <code>Lavender</code>\n🏷️ <b>Kernel Name:</b> <code>%s%s</code>\n📷 <b>Build Type:</b> <code>%s</code>\n⏱️ <b>Time:</b> <code>%s</code>\n\n💥 <i>Check build.log for details.</i>' "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "$CAM_TYPE" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
            -F chat_id="${{ inputs.TELEGRAM_GROUP_ID }}" \
            -F document="@${{ env.KERNEL_DIR }}/build.log" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
